services:
  jwt-keys:
    build: .
    user: "0:0"
    environment:
      JWT_PRIVATE_KEY_PATH: /run/jwt/private.pem
      JWT_PUBLIC_KEY_PATH: /run/jwt/public.pem
    volumes:
      - jwt_keys:/run/jwt
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 128m
    command: ["python", "-m", "app.scripts.generate_jwt_keys"]
    networks: [backend]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: soc
      POSTGRES_USER: soc_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-soc_owner_local_only}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-soc_app_local_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-app-user.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc_owner -d soc"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://soc_app:${POSTGRES_APP_PASSWORD:-soc_app_local_only}@db:5432/soc
      APP_ENV: development
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      JWT_PRIVATE_KEY_PATH: /run/jwt/private.pem
      JWT_PUBLIC_KEY_PATH: /run/jwt/public.pem
      JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:-local-dev-1}
      OIDC_TRANSACTION_KEY: ${OIDC_TRANSACTION_KEY:-}
      CREDENTIAL_STORE_BACKEND: ${CREDENTIAL_STORE_BACKEND:-environment}
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      OPENBAO_ADDR: ${OPENBAO_ADDR:-}
      OPENBAO_TOKEN: ${OPENBAO_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      OBJECT_STORAGE_BACKEND: ${OBJECT_STORAGE_BACKEND:-filesystem}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-tervyx-archive}
      OBJECT_STORAGE_PREFIX: ${OBJECT_STORAGE_PREFIX:-tervyx}
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-eu-west-1}
      OBJECT_STORAGE_LOCAL_PATH: /var/lib/tervyx/archive
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      jwt-keys:
        condition: service_completed_successfully
    volumes:
      - jwt_keys:/run/jwt:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0
    networks: [backend]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  gateway:
    image: nginx:1.28-alpine
    user: "101:101"
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,uid=101,gid=101,mode=0755,size=16m
      - /var/run:rw,noexec,nosuid,uid=101,gid=101,mode=0755,size=4m
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:8080"
    depends_on:
      api:
        condition: service_started
    networks: [frontend, backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5

  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://soc_owner:${POSTGRES_OWNER_PASSWORD:-soc_owner_local_only}@db:5432/soc
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 512m
    networks: [backend]

  worker:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://soc_app:${POSTGRES_APP_PASSWORD:-soc_app_local_only}@db:5432/soc
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      JWT_PRIVATE_KEY_PATH: /run/jwt/private.pem
      JWT_PUBLIC_KEY_PATH: /run/jwt/public.pem
      JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:-local-dev-1}
      CREDENTIAL_STORE_BACKEND: ${CREDENTIAL_STORE_BACKEND:-environment}
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      OPENBAO_ADDR: ${OPENBAO_ADDR:-}
      OPENBAO_TOKEN: ${OPENBAO_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      OBJECT_STORAGE_BACKEND: ${OBJECT_STORAGE_BACKEND:-filesystem}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-tervyx-archive}
      OBJECT_STORAGE_PREFIX: ${OBJECT_STORAGE_PREFIX:-tervyx}
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-eu-west-1}
      OBJECT_STORAGE_LOCAL_PATH: /var/lib/tervyx/archive
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      jwt-keys:
        condition: service_completed_successfully
    volumes:
      - jwt_keys:/run/jwt:ro
      - event_archive:/var/lib/tervyx/archive
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 512
    mem_limit: 1g
    cpus: 1.5
    networks: [backend, integration_egress]
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO"]

  beat:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://soc_app:${POSTGRES_APP_PASSWORD:-soc_app_local_only}@db:5432/soc
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-300}
      JWT_PRIVATE_KEY_PATH: /run/jwt/private.pem
      JWT_PUBLIC_KEY_PATH: /run/jwt/public.pem
      JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:-local-dev-1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      jwt-keys:
        condition: service_completed_successfully
    volumes:
      - jwt_keys:/run/jwt:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    networks: [backend]
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m

  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGDATABASE: soc
      PGUSER: soc_owner
      PGPASSWORD: ${POSTGRES_OWNER_PASSWORD:-soc_owner_local_only}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - postgres_backups:/backups
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        umask 077
        while true; do
          target="/backups/soc-$$(date -u +%Y%m%dT%H%M%SZ).dump"
          pg_dump --format=custom --no-password --file="$$target"
          pg_restore --list "$$target" >/dev/null
          find /backups -type f -name 'soc-*.dump' -mtime "+$$BACKUP_RETENTION_DAYS" -delete
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 512m

volumes:
  postgres_data:
  redis_data:
  jwt_keys:
  postgres_backups:
  event_archive:

networks:
  frontend:
  backend:
    internal: true
  integration_egress:
