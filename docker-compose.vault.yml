services:
  vault:
    image: hashicorp/vault:1.21.4
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-vault-test-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    command: ["server", "-dev"]
    ports:
      - "127.0.0.1:58200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [backend, vault_test]

networks:
  vault_test:
