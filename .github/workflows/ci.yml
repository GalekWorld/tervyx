name: CI
on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: soc
          POSTGRES_USER: soc_owner
          POSTGRES_PASSWORD: owner_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U soc_owner -d soc"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      vault:
        image: hashicorp/vault:1.21.4
        env:
          VAULT_DEV_ROOT_TOKEN_ID: vault-ci-token
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
          VAULT_DISABLE_MLOCK: "true"
        ports: ["8200:8200"]
    env:
      DATABASE_URL: postgresql+psycopg://soc_app:app_password@localhost:5432/soc
      INTEGRATION_DATABASE_URL: postgresql+psycopg://soc_app:app_password@localhost:5432/soc
      CELERY_BROKER_URL: redis://localhost:6379/0
      INTEGRATION_REDIS_URL: redis://localhost:6379/0
      INTEGRATION_VAULT_ADDR: http://localhost:8200
      INTEGRATION_VAULT_TOKEN: vault-ci-token
      INTEGRATION_OPENBAO_ADDR: http://localhost:58201
      INTEGRATION_OPENBAO_TOKEN: openbao-ci-token
      JWT_PRIVATE_KEY_PATH: /tmp/soc-ci-jwt/private.pem
      JWT_PUBLIC_KEY_PATH: /tmp/soc-ci-jwt/public.pem
      JWT_ACTIVE_KID: ci-key-1
      APP_ENV: test
      RATE_LIMIT_ENABLED: "false"
      ALLOW_PRIVATE_INTEGRATION_URLS: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Pin pip for deterministic lock tooling
        run: python -m pip install --upgrade "pip==25.3"
      - name: Generate ephemeral CI signing key
        run: |
          mkdir -p /tmp/soc-ci-jwt
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/soc-ci-jwt/private.pem
          openssl rsa -pubout -in /tmp/soc-ci-jwt/private.pem -out /tmp/soc-ci-jwt/public.pem
      - name: Install hash-locked development dependencies
        run: pip install --require-hashes -r requirements-dev.lock
      - name: Verify dependency locks are current
        shell: bash
        run: |
          set -euo pipefail
          pip-compile --quiet --generate-hashes --strip-extras --constraint requirements.lock --output-file /tmp/requirements.lock requirements.txt
          # pip-tools embeds the requested output pathname in generated comments.
          # Compare only resolved requirements and hashes; metadata is not dependency state.
          diff --unified=0 <(grep -v '^[[:space:]]*#' requirements.lock) <(grep -v '^[[:space:]]*#' /tmp/requirements.lock)
          pip-compile --quiet --generate-hashes --strip-extras --constraint requirements-dev.lock --output-file /tmp/requirements-dev.lock requirements-dev.txt
          diff --unified=0 <(grep -v '^[[:space:]]*#' requirements-dev.lock) <(grep -v '^[[:space:]]*#' /tmp/requirements-dev.lock)
      - name: Create restricted runtime database role
        run: sh docker/postgres/init-app-user.sh
        env:
          PGHOST: localhost
          PGPASSWORD: owner_password
          POSTGRES_DB: soc
          POSTGRES_USER: soc_owner
          POSTGRES_APP_PASSWORD: app_password
      - name: Start OpenBao contract service
        run: |
          docker run -d --name openbao-ci -p 127.0.0.1:58201:8200 \
            ghcr.io/openbao/openbao:2.6.1 server -dev \
            -dev-root-token-id="$INTEGRATION_OPENBAO_TOKEN" \
            -dev-listen-address=0.0.0.0:8200
          for attempt in $(seq 1 30); do
            : "$attempt"
            curl --fail --silent \
              -H "X-Vault-Token: $INTEGRATION_OPENBAO_TOKEN" \
              http://127.0.0.1:58201/v1/sys/health && exit 0
            sleep 1
          done
          docker logs openbao-ci
          exit 1
      - run: black --check app tests
      - run: ruff check app tests
      - name: Validate vulnerability policy
        run: python scripts/validate_vulnerability_policy.py
      - name: Validate supply-chain repository controls
        run: python scripts/validate_supply_chain.py
      - run: mypy app
      - name: Bandit high-confidence/high-severity scan
        run: bandit -r app -lll -iii
      - name: Semgrep security scan
        run: >-
          docker run --rm -v "${{ github.workspace }}:/src" -w /src
          semgrep/semgrep@sha256:b94b53d02fd4a022f9eac4e2af1380f5c3c4c21400e79d3336bdff1d1db5e796
          semgrep scan --config=p/python --config=p/security-audit --severity=ERROR --error app
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://soc_owner:owner_password@localhost:5432/soc
      - run: alembic check
        env:
          DATABASE_URL: postgresql+psycopg://soc_owner:owner_password@localhost:5432/soc
      - run: pytest --cov=app --cov-report=xml --junitxml=test-results.xml --cov-fail-under=80
      - name: PostgreSQL backup and restore drill
        run: |
          set -o pipefail
          container="${{ job.services.postgres.id }}"
          {
            docker exec -e PGPASSWORD=owner_password "$container" pg_dump -U soc_owner -d soc -Fc -f /tmp/soc.dump
            docker exec -e PGPASSWORD=owner_password "$container" createdb -U soc_owner soc_restore_ci
            docker exec -e PGPASSWORD=owner_password "$container" pg_restore -U soc_owner --exit-on-error --no-owner -d soc_restore_ci /tmp/soc.dump
            docker exec -e PGPASSWORD=owner_password "$container" psql -U soc_owner -d soc_restore_ci -Atc "SELECT version_num FROM alembic_version"
            docker exec -e PGPASSWORD=owner_password "$container" dropdb -U soc_owner --force soc_restore_ci
          } 2>&1 | tee restore-drill.log
      - name: Upload test evidence
        if: ${{ always() && hashFiles('test-results.xml') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ github.sha }}
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: error
      - name: Upload restore-drill evidence
        if: ${{ always() && hashFiles('restore-drill.log') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restore-drill-${{ github.sha }}
          path: restore-drill.log
          if-no-files-found: error
      - name: Audit runtime dependencies against advisories
        # Strict collection, bounded network timeout and no interactive spinner
        # make advisory-service failures fail closed instead of silently passing.
        run: pip-audit --strict --progress-spinner off --timeout 30 -r requirements.lock
      - run: docker build -t autonomous-soc:${{ github.sha }} .
      - name: Generate SPDX SBOM
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          anchore/syft@sha256:825cad3a952c87676a6d07e9a3bb05ac9c401d598360070e970aa46d54c1727e
          autonomous-soc:${{ github.sha }} -o spdx-json > sbom-ci.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom-ci.spdx.json
          if-no-files-found: error
      - name: Trivy image scan
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e
          image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1
          autonomous-soc:${{ github.sha }}
      - name: Gitleaks repository scan
        run: >-
          docker run --rm -v "${{ github.workspace }}:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          dir /repo --config /repo/.gitleaks.toml --redact --exit-code 1
      - name: Start API for DAST
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 >/tmp/soc-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            : "$attempt"
            curl --fail --silent http://127.0.0.1:8000/health/ready && exit 0
            sleep 1
          done
          cat /tmp/soc-api.log
          exit 1
      - name: OWASP ZAP baseline
        run: >-
          docker run --rm --network host
          ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
          zap-baseline.py -t http://127.0.0.1:8000/openapi.json -I -m 1
