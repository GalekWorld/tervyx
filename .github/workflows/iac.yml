name: IaC Guardrails

on:
  pull_request:
    paths: ["infra/**", "scripts/validate_iac.py", ".github/workflows/iac.yml"]
  push:
    branches: [main]
    paths: ["infra/**", "scripts/validate_iac.py", ".github/workflows/iac.yml"]

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - run: python scripts/validate_iac.py
