name: IaC Guardrails

on:
  pull_request:
    paths: ["infra/**", "scripts/validate_iac.py", ".github/workflows/iac.yml"]
  push:
    branches: [main]
    paths: ["infra/**", "scripts/validate_iac.py", ".github/workflows/iac.yml"]

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python scripts/validate_iac.py
